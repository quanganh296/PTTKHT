<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lọc Sản Phẩm - Website Thương Mại Điện Tử</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* === NGUYÊN TẮC UI/UX ÁP DỤNG ===
         * 1. Đơn giản: Chỉ hiển thị các tiêu chí cần thiết, không gây rối mắt.
         * 2. Rõ ràng: Label + Icon + Placeholder hướng dẫn cụ thể.
         * 3. Dễ thao tác: Dropdown, range slider, nút CTA nổi bật.
         * 4. Trực quan: Icon hỗ trợ nhận diện nhanh (🧩 lọc, ❌ xóa).
         * 5. Responsive: Sidebar trên desktop, collapsible trên mobile.
         * 6. Accessibility: aria-label, focus states, keyboard navigable.
         */

        :root {
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --danger: #e63946;
            --danger-hover: #d00000;
            --gray-100: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-300: #dee2e6;
            --gray-600: #6c757d;
            --gray-800: #343a40;
            --gray-900: #212529;
            --radius: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,.1);
            --shadow-md: 0 4px 16px rgba(0,0,0,.12);
            --transition: all .2s ease;
            --font-base: 1rem;
        }

        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fa;
            color: var(--gray-900);
            line-height: 1.5;
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 1rem;
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* === SIDEBAR FILTER === */
        .filter-sidebar {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 1.5rem;
            width: 100%;
            max-width: 300px;
            height: fit-content;
            position: sticky;
            top: 1rem;
        }

        .filter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: .75rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .filter-title {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-weight: 600;
            font-size: 1.125rem;
            color: var(--gray-800);
        }

        .filter-title i {
            color: var(--primary);
            font-size: 1.25rem;
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--gray-600);
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin-bottom: .5rem;
            font-weight: 500;
            font-size: .9375rem;
            color: var(--gray-800);
        }

        .form-label i {
            color: var(--gray-600);
            width: 1.25rem;
            text-align: center;
        }

        /* Select Dropdown */
        .select-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            padding: .75rem 1rem .75rem 2.5rem;
            font-size: var(--font-base);
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            background: #fff;
            appearance: none;
            cursor: pointer;
            transition: var(--transition);
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67,97,238,.25);
        }

        .select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-600);
            pointer-events: none;
        }

        .select-icon {
            position: absolute;
            left: .75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-600);
            font-size: 1.1rem;
            pointer-events: none;
        }

        /* Range Slider */
        .price-range {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin-top: .75rem;
        }

        .price-input {
            width: 100%;
            padding: .5rem .75rem;
            font-size: .9375rem;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            text-align: center;
        }

        .price-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67,97,238,.25);
        }

        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--gray-200);
            outline: none;
            margin: 1rem 0;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(67,97,238,.3);
        }

        .range-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(67,97,238,.3);
        }

        /* Action Buttons */
        .filter-actions {
            display: flex;
            gap: .75rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: .75rem 1rem;
            font-size: .9375rem;
            font-weight: 600;
            text-align: center;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-800);
            border: 1px solid var(--gray-300);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
            border-color: var(--gray-400);
        }

        .btn i {
            font-size: 1.1rem;
        }

        /* === PRODUCT GRID (MOCK) === */
        .product-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            padding: 1rem 0;
        }

        .product-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .product-img {
            height: 200px;
            background: var(--gray-200);
            background-size: cover;
            background-position: center;
        }

        .product-info {
            padding: 1rem;
        }

        .product-name {
            font-weight: 500;
            margin: 0 0 .5rem;
            color: var(--gray-900);
        }

        .product-price {
            font-weight: 600;
            color: var(--primary);
            font-size: 1.125rem;
        }

        .badge {
            position: absolute;
            top: .75rem;
            left: .75rem;
            background: var(--danger);
            color: #fff;
            font-size: .75rem;
            font-weight: 600;
            padding: .25rem .5rem;
            border-radius: 4px;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 1rem .5rem;
            }

            .filter-sidebar {
                max-width: none;
                position: relative;
                top: 0;
            }

            .mobile-toggle {
                display: block;
            }

            .filter-content {
                display: none;
            }

            .filter-content.active {
                display: block;
                animation: slideDown .3s ease-out;
            }

            @keyframes slideDown {
                from { opacity: 0; transform: translateY(-10px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .filter-actions {
                position: sticky;
                bottom: 0;
                background: #fff;
                padding: 1rem 0;
                border-top: 1px solid var(--gray-200);
                margin: 1.5rem -1.5rem 0;
            }
        }

        @media (min-width: 1024px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- FILTER SIDEBAR -->
        <aside class="filter-sidebar" aria-labelledby="filter-title">
            <div class="filter-header">
                <h2 id="filter-title" class="filter-title">
                    <i class="fas fa-filter"></i> Bộ lọc
                </h2>
                <button class="mobile-toggle" aria-label="Ẩn/Mở bộ lọc" aria-expanded="true">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>

            <div class="filter-content active">
                <form id="filterForm">
                    <!-- Danh mục -->
                    <div class="form-group">
                        <label class="form-label" for="category">
                            <i class="fas fa-tags"></i> Danh mục
                        </label>
                        <div class="select-wrapper">
                            <i class="fas fa-list select-icon"></i>
                            <select id="category" aria-label="Chọn danh mục sản phẩm">
                                <option value="">Tất cả danh mục</option>
                                <option value="clothing">Quần áo</option>
                                <option value="electronics">Điện tử</option>
                                <option value="books">Sách</option>
                                <option value="home">Nhà cửa</option>
                                <option value="beauty">Làm đẹp</option>
                            </select>
                        </div>
                    </div>

                    <!-- Khoảng giá -->
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-coins"></i> Khoảng giá
                        </label>
                        <div style="position:relative;">
                            <input 
                                type="range" 
                                class="range-slider" 
                                min="0" 
                                max="5000000" 
                                value="2500000" 
                                step="50000"
                                id="priceRange"
                                aria-label="Thanh kéo chọn khoảng giá">
                            <div class="price-range">
                                <input 
                                    type="text" 
                                    class="price-input" 
                                    id="priceMin" 
                                    value="0" 
                                    placeholder="Từ">
                                <span>—</span>
                                <input 
                                    type="text" 
                                    class="price-input" 
                                    id="priceMax" 
                                    value="5.000.000" 
                                    placeholder="Đến">
                            </div>
                        </div>
                    </div>

                    <!-- Sắp xếp -->
                    <div class="form-group">
                        <label class="form-label" for="sort">
                            <i class="fas fa-sort-amount-down"></i> Sắp xếp theo
                        </label>
                        <div class="select-wrapper">
                            <i class="fas fa-sort select-icon"></i>
                            <select id="sort" aria-label="Chọn cách sắp xếp">
                                <option value="default">Mặc định</option>
                                <option value="price-asc">Giá tăng dần</option>
                                <option value="price-desc">Giá giảm dần</option>
                                <option value="bestseller">Bán chạy nhất</option>
                                <option value="newest">Mới nhất</option>
                            </select>
                        </div>
                    </div>

                    <!-- Nút hành động -->
                    <div class="filter-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-search"></i> Lọc
                        </button>
                        <button type="button" id="clearFilter" class="btn btn-secondary">
                            <i class="fas fa-trash-alt"></i> Xóa
                        </button>
                    </div>
                </form>
            </div>
        </aside>

        <!-- PRODUCT GRID (MOCK DATA) -->
        <main class="product-grid" role="region" aria-label="Danh sách sản phẩm">
            <!-- Sản phẩm mẫu -->
            <article class="product-card">
                <div class="product-img" style="background-image: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400')"></div>
                <div class="product-info">
                    <h3 class="product-name">Giày Thể Thao UltraBoost</h3>
                    <p class="product-price">2.890.000đ</p>
                </div>
                <span class="badge">-20%</span>
            </article>

            <article class="product-card">
                <div class="product-img" style="background-image: url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400')"></div>
                <div class="product-info">
                    <h3 class="product-name">Tai nghe Bluetooth Pro</h3>
                    <p class="product-price">1.250.000đ</p>
                </div>
            </article>

            <article class="product-card">
                <div class="product-img" style="background-image: url('https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400')"></div>
                <div class="product-info">
                    <h3 class="product-name">Sách: Atomic Habits</h3>
                    <p class="product-price">189.000đ</p>
                </div>
                <span class="badge">Mới</span>
            </article>

            <!-- Thêm nhiều sản phẩm nếu cần -->
            <div style="grid-column: 1 / -1; text-align:center; padding:2rem; color:var(--gray-600);">
                <p><em>→ Kết quả sẽ được cập nhật khi bạn nhấn "Lọc"</em></p>
            </div>
        </main>
    </div>

    <script>
        // Mobile toggle
        const toggleBtn = document.querySelector('.mobile-toggle');
        const filterContent = document.querySelector('.filter-content');
        const icon = toggleBtn.querySelector('i');

        toggleBtn.addEventListener('click', () => {
            const isActive = filterContent.classList.toggle('active');
            toggleBtn.setAttribute('aria-expanded', isActive);
            icon.classList.toggle('fa-chevron-up', isActive);
            icon.classList.toggle('fa-chevron-down', !isActive);
        });

        // Range slider sync với input
        const range = document.getElementById('priceRange');
        const minInput = document.getElementById('priceMin');
        const maxInput = document.getElementById('priceMax');

        function formatPrice(value) {
            return new Intl.NumberFormat('vi-VN').format(value) + 'đ';
        }

        function parsePrice(str) {
            return parseInt(str.replace(/[^0-9]/g, '')) || 0;
        }

        range.addEventListener('input', () => {
            const value = range.value;
            const min = 0;
            const max = 5000000;
            const percent = (value - min) / (max - min) * 100;

            // Cập nhật input
            minInput.value = formatPrice(0);
            maxInput.value = formatPrice(value);
        });

        // Input số chỉ cho phép số + định dạng
        [minInput, maxInput].forEach(input => {
            input.addEventListener('input', function() {
                let val = this.value.replace(/[^0-9]/g, '');
                if (val) this.value = new Intl.NumberFormat('vi-VN').format(val) + 'đ';
                else this.value = '0đ';
            });
        });

        // Xử lý form
        const form = document.getElementById('filterForm');
        const clearBtn = document.getElementById('clearFilter');

        form.addEventListener('submit', e => {
            e.preventDefault();
            alert('Đã áp dụng bộ lọc!\n(Thực tế: gọi API với các tham số đã chọn)');
        });

        clearBtn.addEventListener('click', () => {
            form.reset();
            range.value = 2500000;
            minInput.value = '0đ';
            maxInput.value = '5.000.000đ';
            alert('Đã xóa toàn bộ bộ lọc!');
        });

        // Khởi tạo giá trị ban đầu
        minInput.value = '0đ';
        maxInput.value = formatPrice(range.value);
    </script>
</body>
</html>
